<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Santiago Paz Farfán is a full-stack software engineer in Houston, Texas. Explore his work with React, TypeScript, Python, and AWS in an interactive portfolio."
    />
    <meta property="og:title" content="Santiago Paz Farfán — Software Engineer" />
    <meta
      property="og:description"
      content="Santiago Paz Farfán. Full-stack software engineer in Houston, Texas. Work, experience, and contact information in an interactive terminal."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Santiago Paz Farfán — Software Engineer</title>
    <script>
      try {
        const saved = localStorage.getItem('portfolio-terminal-theme');
        document.documentElement.dataset.theme = [
          'dark',
          'light',
          'amber',
          'phosphor',
          'paper',
        ].includes(saved)
          ? saved
          : 'dark';
        document.documentElement.dataset.crt =
          localStorage.getItem('portfolio-crt-effects') === 'off' ? 'off' : 'on';
        const language = new URLSearchParams(location.search).get('lang');
        document.documentElement.lang =
          language === 'en' || language === 'es'
            ? language
            : localStorage.getItem('portfolio-language') === 'es'
              ? 'es'
              : 'en';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
